<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעקב פיננסי</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.05);
            --glass-highlight: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --input-bg: rgba(15, 23, 42, 0.4);
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at top right, #1e293b 0%, #0f172a 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 32px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        h2 {
            margin: 0 0 32px 0;
            font-weight: 500;
            font-size: 1.5rem;
            letter-spacing: -0.025em;
            text-align: right;
        }

        .form-group {
            margin-bottom: 24px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 16px;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus, select:focus {
            border-color: var(--glass-highlight);
            background: rgba(15, 23, 42, 0.6);
            box-shadow: 0 0 0 1px var(--glass-highlight);
        }

        input::placeholder {
            color: #475569;
        }

        select option {
            background: #0f172a;
            color: var(--text-main);
        }

        button {
            width: 100%;
            padding: 16px;
            background: var(--text-main);
            color: #0f172a;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background: #e2e8f0;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        #statusMessage {
            margin-top: 20px;
            text-align: center;
            font-size: 0.875rem;
            min-height: 20px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .show-status {
            opacity: 1 !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>הוספת תנועה</h2>
    <form id="trackerForm">
        <div class="form-group">
            <label for="date">תאריך</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group">
            <label for="type">סוג</label>
            <select id="type" required>
                <option value="הוצאה">הוצאה</option>
                <option value="הכנסה">הכנסה</option>
            </select>
        </div>

        <div class="form-group">
            <label for="category">קטגוריה</label>
            <input type="text" id="category" placeholder="לדוגמה: אוכל, דלק, משכורת" required>
        </div>

        <div class="form-group">
            <label for="amount">סכום (₪)</label>
            <input type="number" id="amount" placeholder="0.00" step="0.01" required>
        </div>

        <div class="form-group">
            <label for="description">הערות (אופציונלי)</label>
            <input type="text" id="description" placeholder="פירוט נוסף...">
        </div>

        <button type="submit" id="submitBtn">שמירה</button>
        <div id="statusMessage"></div>
    </form>
</div>

<script>
    document.getElementById('date').valueAsDate = new Date();

    document.getElementById('trackerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMessage');
        
        submitBtn.disabled = true;
        submitBtn.innerText = 'שומר נתונים...';
        statusMsg.classList.remove('show-status');
        
        const data = {
            date: document.getElementById('date').value,
            type: document.getElementById('type').value,
            category: document.getElementById('category').value,
            amount: document.getElementById('amount').value,
            description: document.getElementById('description').value
        };

        const scriptURL = 'https://script.google.com/macros/s/AKfycbyGmtZ8az5PFSI1bNYdCciurqLQe36cSx8ZdV74YJoD5oqJFR9Gn6q97gvdw-rmRKBo/exec';

        fetch(scriptURL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
            if(result.status === 'success') {
                statusMsg.innerText = 'התנועה נשמרה בהצלחה!';
                statusMsg.style.color = 'var(--success)';
                statusMsg.classList.add('show-status');
                
                document.getElementById('trackerForm').reset();
                document.getElementById('date').valueAsDate = new Date();
                
                setTimeout(() => {
                    statusMsg.classList.remove('show-status');
                }, 3000);
            } else {
                throw new Error(result.message);
            }
        })
        .catch(error => {
            statusMsg.innerText = 'אירעה שגיאה. נסה שוב.';
            statusMsg.style.color = 'var(--error)';
            statusMsg.classList.add('show-status');
            console.error('Error:', error);
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = 'שמירה';
        });
    });
</script>
</body>
</html>
